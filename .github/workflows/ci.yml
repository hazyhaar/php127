name: php127 CI & Parity Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Go 1.27 Test & Differential Parity Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout php127
        uses: actions/checkout@v4

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Install PHP CLI for Differential Oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Build Standalone CLI & Verify Suites
        run: |
          go build -o /tmp/php127 ./cmd/php127
          LC_ALL=C LANG=C go test -race -count=1 ./zone/... ./types/... ./lexer/... ./parser/... ./ast/... ./bytecode/... ./compiler/... ./stdlib/... ./vm/... ./sapi/... ./ext/... ./fiber/... ./filter/... ./datetime/... ./pdo/... ./reflection/... ./session/... ./spl/... ./streams/... ./cmd/...
