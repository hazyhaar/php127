name: php127 CI Gate & Torture Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-gate:
    name: Industrial CI Gate (7 Gates)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.27.x' ]

    steps:
      - name: Checkout php127 Code
        uses: actions/checkout@v4

      - name: Checkout c2simd dependency
        uses: actions/checkout@v4
        with:
          repository: hazyhaar/c2simd
          path: .c2simd_checkout

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install System Dependencies & Setup Paths
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
          mkdir -p ../c2simd
          cp -r .c2simd_checkout/c2pkg ../c2simd/
          rm -rf .c2simd_checkout

      - name: Execute 7-Gate CI Suite
        run: |
          chmod +x ./scripts/ci_gate.sh
          ./scripts/ci_gate.sh
