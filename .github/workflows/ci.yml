name: php127 CI Gate & Torture Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-gate:
    name: Industrial CI Gate (7 Gates)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.27.x' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Execute 7-Gate CI Suite
        run: |
          chmod +x ./scripts/ci_gate.sh
          ./scripts/ci_gate.sh
